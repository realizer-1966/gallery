<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Unit Converter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      width: 100%;
      max-width: 340px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .title { color: #93c5fd; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; margin-bottom: 16px; }
    .result-box {
      background: #0b1220;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      margin-bottom: 18px;
      border: 1px solid rgba(59,130,246,0.3);
    }
    .expr { color: #64748b; font-size: 0.9rem; margin-bottom: 4px; }
    .result { color: #f8fafc; font-size: 1.6rem; font-weight: 800; }
    .unit-badge { color: #60a5fa; font-size: 1.1rem; }
    .grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
    .field {
      background: #1e293b; border: 1px solid rgba(100,116,139,0.4);
      border-radius: 12px; padding: 14px; text-align: center; color: #e2e8f0; font-weight: 600; font-size: 1.05rem;
    }
    .arrow { color: #38bdf8; font-size: 1.3rem; text-align: center; }
    .label { color: #64748b; font-size: 0.7rem; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">📏 UNIT CONVERTER</div>
    <div class="result-box">
      <div class="expr" id="expr">—</div>
      <div class="result"><span id="res">—</span> <span class="unit-badge" id="toUnit">—</span></div>
    </div>
    <div class="grid">
      <div>
        <div class="field" id="fromVal">—</div>
        <div class="label" id="fromLabel">FROM</div>
      </div>
      <div class="arrow">→</div>
      <div>
        <div class="field" id="toVal">—</div>
        <div class="label" id="toLabel">TO</div>
      </div>
    </div>
  </div>
  <script>
    try {
      const p = new URLSearchParams(window.location.search);
      const value = p.get('value');
      const from = p.get('from');
      const to = p.get('to');
      const result = p.get('result');
      document.getElementById('fromVal').textContent = value ?? '—';
      document.getElementById('fromLabel').textContent = (from ?? '?').toUpperCase();
      document.getElementById('toLabel').textContent = (to ?? '?').toUpperCase();
      document.getElementById('res').textContent = result ?? '—';
      document.getElementById('toUnit').textContent = (to ?? '').toUpperCase();
      document.getElementById('expr').textContent = `${value ?? '?'} ${from ?? '?'} = ${result ?? '?'} ${to ?? '?'}`;
    } catch (e) { /* noop */ }
  </script>
</body>
</html>
